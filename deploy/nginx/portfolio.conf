# /etc/nginx/sites-available/portfolio  (replace example.com; see docs/DEPLOYMENT.md)
# Cloudflare (proxied, SSL mode "Full (strict)") -> Nginx :443 -> app on 127.0.0.1:3000

# Real client IP from Cloudflare. Refresh the ranges periodically:
#   https://www.cloudflare.com/ips-v4  https://www.cloudflare.com/ips-v6
# Generate this file with deploy/nginx/update-cloudflare-ips.sh
include /etc/nginx/snippets/cloudflare-real-ip.conf;
real_ip_header CF-Connecting-IP;

# Outer abuse limits (the app also rate-limits in PostgreSQL).
limit_req_zone $binary_remote_addr zone=portfolio_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=portfolio_auth:10m rate=10r/m;

upstream portfolio_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name example.com www.example.com;
  return 301 https://example.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.example.com;
  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  return 301 https://example.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name example.com;

  # Cloudflare Origin Certificate (15-year) or Let's Encrypt. Enable Authenticated Origin Pulls to
  # reject traffic that did not come through Cloudflare.
  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
  ssl_verify_client on;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Uploads: 8 MB file limit in the app + form overhead.
  client_max_body_size 10m;
  server_tokens off;

  location / {
    limit_req zone=portfolio_general burst=40 nodelay;
    proxy_pass http://portfolio_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (never append) so clients cannot spoof their IP; the app trusts X-Real-IP.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }

  location /api/auth/ {
    limit_req zone=portfolio_auth burst=10 nodelay;
    proxy_pass http://portfolio_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Immutable build assets and media (keys change on replace) can be cached hard by Cloudflare.
  location ~ ^/(_next/static|media)/ {
    proxy_pass http://portfolio_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
