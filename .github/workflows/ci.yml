name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql://porto:porto@localhost:5432/porto_test?schema=public
  E2E_DATABASE_URL: postgresql://porto:porto@localhost:5432/porto_e2e?schema=public
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, unit + integration, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: porto, POSTGRES_PASSWORD: porto, POSTGRES_DB: porto_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U porto" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://porto:porto@localhost:5432/porto_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: porto, POSTGRES_PASSWORD: porto, POSTGRES_DB: porto_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U porto" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { DATABASE_URL: "${{ env.E2E_DATABASE_URL }}" }
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results, retention-days: 7 }

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [check, e2e]
    # Only for the self-hosted VPS route (repo variable DEPLOY_TARGET=vps). On Vercel, Vercel deploys from GitHub itself.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'vps'
    environment: production
    steps:
      # Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (deploy-only key), VPS_PATH. Set them in the "production" environment.
      - name: Pull, build and restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH }}"
            export COMPOSE_ENV_FILES=.env.production
            git fetch --depth 1 origin main
            git reset --hard origin/main
            # Migrations run in the "migrate" service before the app starts; nothing resets or seeds.
            docker compose up -d --build --remove-orphans
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 2; done
            echo "Health check failed" >&2
            docker compose logs --tail 100 app
            exit 1
