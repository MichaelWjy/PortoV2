# Local development database only. Bound to localhost; never use these credentials in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: porto
      POSTGRES_PASSWORD: porto_dev_password
      POSTGRES_DB: porto
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - porto-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porto -d porto"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  porto-dev-db:
